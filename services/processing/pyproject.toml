[project]
name = "rag-processing"
version = "0.1.0"
description = "Async document processing pipeline (normalization, chunking, embedding)"
requires-python = ">=3.12"
dependencies = [
    "rag-common",
    "rag-contracts",
    "uvicorn[standard]>=0.34",
    "rag-db",
]

[tool.uv.sources]
rag-common = { workspace = true }
rag-contracts = { workspace = true }
rag-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processing"]
