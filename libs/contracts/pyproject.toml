[project]
name = "rag-contracts"
version = "0.1.0"
description = "Pydantic models shared across service boundaries"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_contracts"]
