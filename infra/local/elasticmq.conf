# ElasticMQ (SQS-compatible) queues for local dev; mirrors infra/aws SQS (ADR-0009).
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

queues {
  rag-processing {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "rag-processing-dlq"
      maxReceiveCount = 3
    }
  }
  rag-processing-dlq {}
}
