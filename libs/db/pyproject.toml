[project]
name = "rag-db"
version = "0.1.0"
description = "Shared SQLAlchemy models and session helpers (single MVP database, ADR-0004)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_db"]
