services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      RAG_ENVIRONMENT: dev
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  processing:
    build:
      context: .
      dockerfile: services/processing/Dockerfile
    environment:
      RAG_ENVIRONMENT: dev
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  retrieval:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile
    environment:
      RAG_ENVIRONMENT: dev
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  generation:
    build:
      context: .
      dockerfile: services/generation/Dockerfile
    environment:
      RAG_ENVIRONMENT: dev
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
