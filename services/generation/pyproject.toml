[project]
name = "rag-generation"
version = "0.1.0"
description = "Gemini-backed answer generation with citations"
requires-python = ">=3.12"
dependencies = [
    "rag-common",
    "rag-contracts",
    "rag-providers",
    "rag-guardrails",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
]

[tool.uv.sources]
rag-common = { workspace = true }
rag-contracts = { workspace = true }
rag-providers = { workspace = true }
rag-guardrails = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generation"]
