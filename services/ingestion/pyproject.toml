[project]
name = "rag-ingestion"
version = "0.1.0"
description = "Document upload, parsing, deduplication, and versioning"
requires-python = ">=3.12"
dependencies = [
    "rag-common",
    "rag-contracts",
    "uvicorn[standard]>=0.34",
    "rag-db",
    "pypdf>=5.1",
    "python-multipart>=0.0.20",
    "alembic>=1.14",
    "boto3>=1.43",
]

[tool.uv.sources]
rag-common = { workspace = true }
rag-contracts = { workspace = true }
rag-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
