name: LLM Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Skip silently when the secret is unavailable (e.g. forks).
    steps:
      - uses: actions/checkout@v4
      - name: Check secret presence
        id: gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY secret not present; skipping smoke tests."
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.have_key == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.gate.outputs.have_key == 'true'
        run: uv sync --all-packages
      - name: Run real-LLM smoke tests
        if: steps.gate.outputs.have_key == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run pytest -q -k "llm_smoke" --no-cov
