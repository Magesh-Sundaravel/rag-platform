[project]
name = "rag-evaluation"
version = "0.1.0"
description = "Minimal RAGAS-style answer-quality metrics via judge-prompted scoring (ADR-0007)"
requires-python = ">=3.12"
dependencies = [
    "rag-contracts",
    "rag-providers",
]

[tool.uv.sources]
rag-contracts = { workspace = true }
rag-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_evaluation"]
